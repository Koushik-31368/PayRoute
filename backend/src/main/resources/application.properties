# =============================================================================
#  PayRoute - Application Configuration
#  All thresholds are tunable here without touching code.
# =============================================================================

spring.application.name=payroute

# ── Database ─────────────────────────────────────────────────────────────────
# In Docker, SPRING_DATASOURCE_URL overrides this via environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/payroute
spring.datasource.username=payroute
spring.datasource.password=payroute
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# create-drop: recreates the schema on each start (good for dev/demo)
# validate:    only validates schema matches entities (good for prod)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Providers ─────────────────────────────────────────────────────────────────
# Ordered list used by the routing engine and registry.
# Add more providers by extending this list and adding their config below.
payroute.providers=PROVIDER_A,PROVIDER_B,PROVIDER_C

# Provider A - most reliable, fastest (like a premium provider, e.g. Stripe)
payroute.providers.PROVIDER_A.failure-rate=0.10
payroute.providers.PROVIDER_A.timeout-rate=0.05
payroute.providers.PROVIDER_A.min-latency-ms=50
payroute.providers.PROVIDER_A.max-latency-ms=200

# Provider B - moderate reliability (like a regional aggregator)
payroute.providers.PROVIDER_B.failure-rate=0.25
payroute.providers.PROVIDER_B.timeout-rate=0.10
payroute.providers.PROVIDER_B.min-latency-ms=100
payroute.providers.PROVIDER_B.max-latency-ms=400

# Provider C - least reliable, highest latency (like a cheap fallback provider)
payroute.providers.PROVIDER_C.failure-rate=0.40
payroute.providers.PROVIDER_C.timeout-rate=0.15
payroute.providers.PROVIDER_C.min-latency-ms=200
payroute.providers.PROVIDER_C.max-latency-ms=800

# ── Circuit Breaker ───────────────────────────────────────────────────────────
# window-size:        number of recent attempts to evaluate (rolling window)
# failure-threshold:  fraction [0.0-1.0] that triggers OPEN state
# cooldown-seconds:   how long to stay OPEN before probing (HALF_OPEN)
#
# Rationale for defaults:
#   window-size=20         - small enough to react fast to spikes,
#                            large enough to avoid false positives from 1-2 bad requests
#   failure-threshold=0.50 - open the breaker when >50% of recent calls fail;
#                            lower (e.g. 0.30) = more sensitive, more false trips
#   cooldown-seconds=30    - gives a provider ~30s to recover; for slow-recovering
#                            providers (e.g. DB restart), increase to 60-120
payroute.circuit-breaker.window-size=20
payroute.circuit-breaker.failure-threshold=0.50
payroute.circuit-breaker.cooldown-seconds=30

# ── Anomaly Detection ─────────────────────────────────────────────────────────
# large-amount-threshold: flag transactions above this INR amount (default: 1 lakh)
# burst-limit:            flag if source submits more than N txns in burst-window-seconds
# burst-window-seconds:   rolling window for burst detection (default: 60s)
# failure-limit:          flag if source has >= N failures in failure-window-seconds
# failure-window-seconds: rolling window for repeated failure detection (default: 5 min)
payroute.anomaly.large-amount-threshold=100000
payroute.anomaly.burst-limit=5
payroute.anomaly.burst-window-seconds=60
payroute.anomaly.failure-limit=3
payroute.anomaly.failure-window-seconds=300

# ── Jackson (JSON) ────────────────────────────────────────────────────────────
# Serialize dates as ISO-8601 strings, not Unix epoch milliseconds.
# Omit null fields from JSON responses to keep payloads lean.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Adding a new provider (example) ──────────────────────────────────────────
# 1. Add PROVIDER_D to the payroute.providers list above.
# 2. Uncomment and configure the lines below.
# 3. No code changes required - ProviderSimulator will pick it up automatically.
# payroute.providers.PROVIDER_D.failure-rate=0.05
# payroute.providers.PROVIDER_D.timeout-rate=0.02
# payroute.providers.PROVIDER_D.min-latency-ms=30
# payroute.providers.PROVIDER_D.max-latency-ms=120
