#  PayRoute â€” Application Configuration
#  All thresholds are tunable here without touching code.
# â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

spring.application.name=payroute

# â”€â”€ Database â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# In Docker, SPRING_DATASOURCE_URL overrides this via environment variable.
spring.datasource.url=jdbc:postgresql://localhost:5432/payroute
spring.datasource.username=payroute
spring.datasource.password=payroute
spring.datasource.driver-class-name=org.postgresql.Driver

# â”€â”€ JPA / Hibernate â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# create-drop: recreates the schema on each start (good for dev/demo)
# validate: only validates schema matches entities (good for prod)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# â”€â”€ Server â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
server.port=8080

# â”€â”€ Providers â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Ordered list used by the routing engine and registry.
# Add more providers by extending this list and adding their config below.
payroute.providers=PROVIDER_A,PROVIDER_B,PROVIDER_C

# Provider A â€” most reliable, fastest (like a premium provider, e.g. Stripe)
payroute.providers.PROVIDER_A.failure-rate=0.10
payroute.providers.PROVIDER_A.timeout-rate=0.05
payroute.providers.PROVIDER_A.min-latency-ms=50
payroute.providers.PROVIDER_A.max-latency-ms=200

# Provider B â€” moderate reliability (like a regional aggregator)
payroute.providers.PROVIDER_B.failure-rate=0.25
payroute.providers.PROVIDER_B.timeout-rate=0.10
payroute.providers.PROVIDER_B.min-latency-ms=100
payroute.providers.PROVIDER_B.max-latency-ms=400

# Provider C â€” least reliable, highest latency (like a cheap fallback provider)
payroute.providers.PROVIDER_C.failure-rate=0.40
payroute.providers.PROVIDER_C.timeout-rate=0.15
payroute.providers.PROVIDER_C.min-latency-ms=200
payroute.providers.PROVIDER_C.max-latency-ms=800

# â”€â”€ Circuit Breaker â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# window-size: number of recent attempts to evaluate (rolling window)
# failure-threshold: fraction [0.0â€“1.0] that triggers OPEN state
# cooldown-seconds: how long to stay OPEN before probing (HALF_OPEN)
#
# Rationale for defaults:
#   window-size=20  â€” small enough to react fast to spikes,
#                     large enough to avoid false positives from 1-2 bad requests
#   failure-threshold=0.50 â€” open the breaker when >50% of recent calls fail;
#                            lower (e.g. 0.30) = more sensitive, more false trips
#   cooldown-seconds=30 â€” gives a provider ~30s to recover; for slow-recovering
#                          providers (e.g. DB restart), increase to 60â€“120
payroute.circuit-breaker.window-size=20
payroute.circuit-breaker.failure-threshold=0.50
payroute.circuit-breaker.cooldown-seconds=30

# â”€â”€ Anomaly Detection â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# large-amount-threshold: flag transactions above this amount
# burst-limit: flag if source submits more than N transactions in burst-window-seconds
# failure-limit: flag if source has more than N failures in failure-window-seconds
payroute.anomaly.large-amount-threshold=100000
payroute.anomaly.burst-limit=5
payroute.anomaly.burst-window-seconds=60
payroute.anomaly.failure-limit=3
payroute.anomaly.failure-window-seconds=300

# â”€â”€ Jackson (JSON) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

